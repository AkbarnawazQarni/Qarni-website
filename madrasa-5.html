<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Madrasa Software</title>
<style>
*{box-sizing:border-box}
:root{--g:#146c43;--d:#0b4a2e;--gold:#b8932f;--bg:#eef3ef}
body{margin:0;background:var(--bg);font-family:'Noto Naskh Arabic','Noto Nastaliq Urdu',Tahoma,Arial,sans-serif;color:#222;font-size:15px}
body.Len{font-family:Arial,Helvetica,sans-serif}
.top{background:var(--g);color:#fff;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#topname{font-size:17px;font-weight:bold}
.lb{display:flex;gap:4px;flex:none}
.lb button{border:1px solid #9cd;background:none;color:#fff;padding:5px 8px;border-radius:6px;font-size:13px}
.lb button.on{background:#fff;color:var(--g);font-weight:bold}
.tabs{display:flex;background:var(--d);position:sticky;top:0;z-index:20;overflow-x:auto}
.tabs button{flex:1 0 auto;padding:11px 12px;border:0;background:none;color:#cfe;font-size:13px;font-family:inherit;white-space:nowrap}
.tabs button.on{background:var(--bg);color:var(--g);font-weight:bold}
.tab{display:none;padding:12px;max-width:900px;margin:auto}.tab.on{display:block}
.card{background:#fff;border-radius:10px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
.card h3{margin:0 0 4px;color:var(--g);font-size:16px}
label{display:block;font-size:13px;margin:9px 0 3px;color:#555}
input,select,textarea{width:100%;padding:9px;border:1px solid #bbb;border-radius:6px;font-size:15px;font-family:inherit;background:#fff}
input[type=checkbox]{width:auto}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px}.chk label{margin:0}
.b{background:var(--g);color:#fff;border:0;padding:10px 14px;border-radius:6px;font-size:15px;margin:8px 0 0;margin-inline-end:6px;font-family:inherit}
.b.r{background:#b02a37}.b.g{background:#555}.b.s{padding:6px 10px;margin:0;font-size:13px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.sc{overflow-x:auto}
.mkt{border-collapse:collapse;width:100%}
.mkt th,.mkt td{border:1px solid #999;padding:4px;text-align:center;font-size:13px;white-space:nowrap}
.mkt th{background:#e5efe8}
.mkt input{padding:5px;text-align:center;width:70px}
.mkt input.rl{width:56px}.mkt input.nm{width:130px}
.pill{display:inline-block;background:#e5efe8;padding:5px 10px;border-radius:14px;margin:4px 0;margin-inline-end:6px;font-size:14px}
.pill a,.x{color:#b02a37;cursor:pointer;font-weight:bold;padding:0 4px}
.ql{display:flex;gap:6px;align-items:center;border-bottom:1px solid #ddd;padding:6px 0}
.ql span.t{flex:1;min-width:0;word-break:break-word}
.ql.h span.t{font-weight:bold;color:var(--g)}
.hint,.small{font-size:12px;color:#777;margin:6px 0 0}
.empty{background:#fff;padding:16px;border-radius:10px;text-align:center;color:#777}
.pv{margin:6px 2px;font-weight:bold;color:var(--g)}
.mkt input.dt{width:135px}.mkt input.w{width:95px}
.rlist{max-height:260px;overflow-y:auto;margin-top:8px}
.ql.st{cursor:pointer}.ql.st.sel{background:#e5efe8}
.bd{font-size:12px;padding:2px 8px;border-radius:10px;color:#fff;flex:none}
.bd.p{background:var(--g)}.bd.w{background:#b02a37}
.ftot{margin-top:8px;font-weight:bold;color:var(--d);font-size:14px}
h4{margin:12px 0 0;color:var(--g)}
.sx.g{color:#146c43;font-weight:bold}.sx.r{color:#b02a37}.sx.o{color:#b8610a}
.mkt .sx{font-size:12px}

/* ---------- documents ---------- */
.sheet{background:#fff;border:3px solid var(--g);padding:5px;margin:12px 0;position:relative;box-shadow:0 2px 8px #0003;overflow:hidden;color:#111;
 -webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .in{border:1px solid var(--gold);padding:16px 14px;min-height:320px;position:relative;z-index:1}
.sheet.f-ur{font-family:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq','Alvi Nastaleeq','Noto Naskh Arabic',Tahoma,serif;line-height:2.1}
.sheet.f-ar{font-family:'Amiri','Traditional Arabic','Noto Naskh Arabic',Tahoma,serif;line-height:1.8;font-size:16px}
.sheet.f-en{font-family:Georgia,'Times New Roman',serif;line-height:1.5}
.wm{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:58%;max-height:70%;object-fit:contain;opacity:.09;z-index:0;pointer-events:none}
#gwm{display:none}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:3px double var(--g);padding-bottom:8px}
.hdr .lg{width:84px;height:84px;object-fit:contain;flex:none}
.hdr .lgs{width:84px;flex:none}
.hm{flex:1;text-align:center;min-width:0}
.hm .bis{font-family:'Amiri','Noto Naskh Arabic','Traditional Arabic',serif;direction:rtl;color:var(--gold);font-size:19px;line-height:1.6}
.hm h1{margin:2px 0;color:var(--d);font-size:26px;line-height:1.5;word-break:break-word}
.hm .ad{font-size:13px;color:#444}
.rib{text-align:center;margin:12px 0 14px;position:relative}
.rib:before{content:"";position:absolute;top:50%;left:0;right:0;border-top:1px solid var(--gold)}
.rib span{position:relative;display:inline-block;background:var(--g);color:#fff;padding:3px 26px;border-radius:22px;border:2px solid var(--gold);font-weight:bold;font-size:17px;line-height:1.7}
.sheet table{width:100%;border-collapse:collapse}
.sheet th{background:var(--g);color:#fff;border:1px solid var(--d);padding:5px 6px;font-size:14px}
.sheet td{border:1px solid #777;padding:4px 6px;text-align:center;font-size:14px}
.sheet tr:nth-child(even) td{background:rgba(20,108,67,.07)}
.sheet table.info{margin-bottom:12px}
.sheet table.info td{text-align:start;border:1px solid var(--gold);background:rgba(184,147,47,.10)}
.sheet td.l{text-align:start}
.sheet .sx.g{color:#146c43;font-weight:bold}.sheet .sx.r{color:#b02a37}.sheet .sx.o{color:#b8610a}
.sheet.rc .in{min-height:240px}
.q{display:flex;gap:8px;margin:8px 0;align-items:flex-start}
.q .qn{font-weight:bold;min-width:28px;color:var(--d)}
.q .qt{flex:1;word-break:break-word}
.q .qm{font-weight:bold;white-space:nowrap}
.sec{text-align:center;margin:16px 0 6px}
.sec span{border-bottom:2px solid var(--gold);padding:0 16px 2px;color:var(--d);font-weight:bold;font-size:17px}
.ins{border:1px dashed var(--gold);padding:4px 10px;margin:6px 0 10px;border-radius:6px;font-size:14px}
.orn{text-align:center;color:var(--gold);letter-spacing:8px;margin-top:18px}
.sum{display:flex;gap:8px;margin:16px 0}
.sum div{flex:1;border:2px solid var(--gold);border-radius:8px;text-align:center;padding:4px;background:rgba(184,147,47,.08)}
.sum small{display:block;color:#555;font-size:12px}.sum b{font-size:18px;color:var(--d)}
.sig{display:flex;justify-content:space-between;gap:10px;margin-top:60px;font-size:14px}
.sig div{border-top:1px solid #000;padding-top:2px;width:28%;text-align:center}
.ms.dense table th,.ms.dense table td{font-size:11px;padding:3px}
@media(max-width:520px){.hm h1{font-size:20px}.hdr .lg,.hdr .lgs{width:56px;height:56px}.sheet .in{padding:10px 8px}}

@page{size:A4 portrait;margin:10mm}
@page ms{size:A4 landscape;margin:10mm}
@media print{
 body{background:#fff}
 .noprint,.top,.tabs,.empty{display:none!important}
 .tab{display:none!important}.tab.on{display:block!important;padding:0;max-width:none}
 .sheet{box-shadow:none;margin:0;background:none;overflow:visible;break-after:page;page-break-after:always}
 .sheet:last-child{break-after:auto;page-break-after:auto}
 .sheet .in{min-height:262mm}
 .sheet.ms{page:ms}.sheet.ms .in{min-height:176mm}
 .sheet.rc .in{min-height:110mm}
 .wm{display:none!important}
 #gwm.has{display:block;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:120mm;max-height:120mm;object-fit:contain;opacity:.1;z-index:0}
}
</style>
</head>
<body class="Lur">
<div class="top noprint">
 <span id="topname"></span>
 <span class="lb">
  <button id="lb-ur" onclick="setLang('ur')">اردو</button>
  <button id="lb-ar" onclick="setLang('ar')">العربية</button>
  <button id="lb-en" onclick="setLang('en')">English</button>
 </span>
</div>
<div class="tabs">
 <button id="tb0" class="on" onclick="go(0)">⚙️ <span data-i="tSetup"></span></button>
 <button id="tb4" onclick="go(4)">📒 <span data-i="tReg"></span></button>
 <button id="tb5" onclick="go(5)">💰 <span data-i="tFee"></span></button>
 <button id="tb1" onclick="go(1)">📝 <span data-i="tPaper"></span></button>
 <button id="tb2" onclick="go(2)">📊 <span data-i="tMarks"></span></button>
 <button id="tb3" onclick="go(3)">🎓 <span data-i="tDmc"></span></button>
</div>
<img id="gwm" alt="">

<!-- SETUP -->
<div class="tab on" id="t0">
 <div class="card noprint">
  <h3 data-i="mInfo"></h3>
  <label data-i="mName"></label><input id="name" oninput="sv()">
  <label data-i="mAddr"></label><input id="addr" oninput="sv()">
  <label data-i="cur"></label><input id="cur" oninput="sv()">
  <label data-i="mLogo"></label>
  <input type="file" id="logof" accept="image/*" hidden onchange="logo(this)"><button class="b" onclick="$('logof').click()" data-i="chooseLogo"></button>
  <div style="margin-top:8px"><img id="lp" alt="" style="height:80px;max-width:100%;display:none"></div>
  <button class="b r" onclick="rmlogo()" data-i="rmLogo"></button>
  <p class="hint" data-i="logoHint"></p>
  <div class="chk"><input type="checkbox" id="bism" onchange="sv()"><label for="bism" data-i="bism"></label></div>
  <label data-i="docLang"></label>
  <select id="dl" onchange="setDl(this.value)">
   <option value="ur">اردو</option><option value="ar">العربية</option><option value="en">English</option>
  </select>
 </div>
 <div class="card noprint">
  <h3 data-i="bkTitle"></h3>
  <button class="b g" onclick="bk()" data-i="bkDl"></button>
  <button class="b g" onclick="shareBk()" data-i="shareBk"></button>
  <input type="file" id="rsf" accept=".json,application/json" hidden onchange="rs(this)"><button class="b" onclick="$('rsf').click()" data-i="chooseBackup"></button>
  <p class="hint" data-i="bkRs"></p>
 </div>
</div>

<!-- PAPER -->
<div class="tab" id="t1">
 <div class="card noprint">
  <h3 data-i="pMake"></h3>
  <div class="row"><div><label data-i="exam"></label><input id="pex" oninput="sv()"></div>
  <div><label data-i="cls"></label><input id="pcl" oninput="sv()"></div></div>
  <div class="row"><div><label data-i="subj"></label><input id="psu" oninput="sv()"></div>
  <div><label data-i="time"></label><input id="ptm" oninput="sv()"></div></div>
  <label data-i="date"></label><input id="pdt" oninput="sv()">
  <label data-i="ins"></label><input id="pins" oninput="sv()">
  <hr>
  <label data-i="newQ"></label><textarea id="qt" rows="3" data-p="qPh"></textarea>
  <label data-i="qMarks"></label><input id="qm" type="number" inputmode="decimal" min="0" value="5">
  <button class="b" onclick="addQ(false)" data-i="addQ"></button>
  <button class="b g" onclick="addQ(true)" data-i="addH"></button>
  <h3 style="margin-top:14px" data-i="qList"></h3>
  <div id="ql"></div>
  <button class="b g" onclick="pr()" data-i="printPdf"></button>
  <p class="hint" data-i="printHint"></p>
 </div>
 <div class="pv noprint" data-i="preview"></div>
 <div id="pout"></div>
</div>

<!-- MARKS -->
<div class="tab" id="t2">
 <div class="card noprint">
  <h3 data-i="eSet"></h3>
  <div class="row"><div><label data-i="exam"></label><input id="mex" oninput="sv()"></div>
  <div><label data-i="cls"></label><input id="mcl" oninput="sv()"></div></div>
  <label data-i="session"></label><input id="mse" oninput="sv()">
  <hr>
  <h3 data-i="subs"></h3>
  <label data-i="subName"></label><input id="sn">
  <div class="row"><div><label data-i="subTot"></label><input id="st" type="number" inputmode="decimal" min="1" value="100"></div>
  <div><label data-i="subPass"></label><input id="sp" type="number" inputmode="decimal" min="0" value="33"></div></div>
  <button class="b" onclick="addS()" data-i="addSub"></button>
  <div id="sl"></div>
  <hr>
  <h3 data-i="stus"></h3>
  <div class="row"><div><label data-i="roll"></label><input id="rn"></div>
  <div><label data-i="sname"></label><input id="nm"></div></div>
  <label data-i="father"></label><input id="fn">
  <button class="b" onclick="addT()" data-i="addStu"></button>
 </div>
 <div class="card noprint">
  <h3 data-i="enter"></h3>
  <label data-i="cls"></label><select id="mfc" onchange="setMf(this.value)"></select>
  <div class="sc"><table class="mkt" id="mt"></table></div>
  <button class="b g" onclick="pr()" data-i="printPdf"></button>
  <p class="hint" data-i="printHint"></p>
 </div>
 <div class="pv noprint" data-i="preview"></div>
 <div id="mout"></div>
</div>

<!-- DMC -->
<div class="tab" id="t3">
 <div class="card noprint">
  <h3 data-i="tDmc"></h3>
  <label data-i="dmcSel"></label><select id="ds" onchange="dmAll=false;dm()"></select>
  <button class="b" onclick="dmAll=false;dm()" data-i="dmcOne"></button>
  <button class="b" onclick="dmAll=true;dm()" data-i="dmcAll"></button>
  <button class="b g" onclick="pr()" data-i="printPdf"></button>
  <p class="hint" data-i="printHint"></p>
 </div>
 <div class="pv noprint" data-i="preview"></div>
 <div id="dout"></div>
</div>

<!-- REGISTER -->
<div class="tab" id="t4">
 <div class="card noprint">
  <h3 data-i="regTitle"></h3>
  <div class="row"><div><label data-i="admNo"></label><input id="ra"></div>
  <div><label data-i="cls"></label><input id="rcl"></div></div>
  <div class="row"><div><label data-i="sname"></label><input id="rnm"></div>
  <div><label data-i="father"></label><input id="rfn"></div></div>
  <button class="b" onclick="addR()" data-i="addStu"></button>
  <hr>
  <div class="row"><input id="rsq" data-p="search" oninput="rl();renderPrev()">
  <select id="rf" onchange="rl();renderPrev()"><option value="" data-i="fAll"></option><option value="p" data-i="fPresent"></option><option value="w" data-i="fWd"></option></select></div>
  <div id="rlist" class="rlist"></div>
  <p class="hint" data-i="selStu"></p>
 </div>
 <div class="card noprint" id="redit" style="display:none">
  <h3 id="rtitle"></h3>
  <div class="row"><div><label data-i="admNo"></label><input id="e_a" oninput="setF('a',this.value)"></div>
  <div><label data-i="roll"></label><input id="e_r" oninput="setF('r',this.value)"></div></div>
  <label data-i="sname"></label><input id="e_n" oninput="setF('n',this.value)">
  <label data-i="father"></label><input id="e_f" oninput="setF('f',this.value)">
  <div class="row"><div><label data-i="cls"></label><input id="e_c" oninput="setF('c',this.value)"></div>
  <div><label data-i="dob"></label><input type="date" id="e_b" onchange="setF('b',this.value)"></div></div>
  <div class="row"><div><label data-i="phone"></label><input id="e_p" oninput="setF('p',this.value)"></div>
  <div><label data-i="admDate"></label><input type="date" id="e_d" onchange="setF('d',this.value)"></div></div>
  <label data-i="sAddr"></label><input id="e_ad" oninput="setF('ad',this.value)">
  <label data-i="mfee"></label><input type="number" inputmode="decimal" step="any" min="0" id="e_fee" oninput="setF('fee',this.value)">
  <label data-i="notes"></label><input id="e_nt" oninput="setF('nt',this.value)">
  <h4 data-i="wdSec"></h4>
  <div class="row"><div><label data-i="wdDate"></label><input type="date" id="e_wd" onchange="setF('wd',this.value)"></div>
  <div><label data-i="wdCls"></label><input id="e_wc" oninput="setF('wc',this.value)"></div></div>
  <label data-i="wdReason"></label><input id="e_wr" oninput="setF('wr',this.value)">
  <label data-i="wdConduct"></label><input id="e_wg" oninput="setF('wg',this.value)">
  <label data-i="wdRemarks"></label><input id="e_wn" oninput="setF('wn',this.value)">
  <button class="b" onclick="wdToday()" data-i="wdToday"></button>
  <button class="b g" onclick="readmit()" data-i="readmit"></button>
  <button class="b r" onclick="delStu(SEL)" data-i="delStu"></button>
 </div>
 <div class="card noprint">
  <button class="b" onclick="showReg()" data-i="showReg"></button>
  <button class="b" onclick="showCert()" data-i="printCert"></button>
  <button class="b g" onclick="pr()" data-i="printPdf"></button>
  <p class="hint" data-i="printHint"></p>
 </div>
 <div class="pv noprint" data-i="preview"></div>
 <div id="rout"></div>
</div>

<!-- FEES -->
<div class="tab" id="t5">
 <div class="card noprint">
  <h3 data-i="tFee"></h3>
  <button class="b" id="fvm" onclick="setFV('m')" data-i="fModeM"></button>
  <button class="b g" id="fvl" onclick="setFV('l')" data-i="fModeL"></button>
  <label data-i="cls"></label><select id="fcl" onchange="fr();fprev()"></select>
  <div id="fmc"><label data-i="fMonth"></label><input type="month" id="fm" onchange="fr();fprev()"></div>
  <div id="flc" style="display:none">
   <label data-i="dmcSel"></label><select id="fs" onchange="lr()"></select>
   <div class="row"><div><label data-i="fFrom"></label><input type="month" id="lf" onchange="fr();fprev()"></div>
   <div><label data-i="fTo"></label><input type="month" id="lt" onchange="fr();fprev()"></div></div>
   <button class="b" onclick="FP='led';fprev()" data-i="fLedgerOne"></button>
   <button class="b" onclick="FP='all';fprev()" data-i="fLedgerAll"></button>
  </div>
  <p class="hint" data-i="fSaved"></p>
 </div>
 <div class="card noprint">
  <h3 data-i="fEnter"></h3>
  <div class="sc"><table class="mkt" id="ft"></table></div>
  <div id="ftot" class="ftot"></div>
  <button class="b" id="fvr" onclick="FP='rep';fprev()" data-i="fMonthRep"></button>
  <button class="b g" onclick="pr()" data-i="printPdf"></button>
  <p class="hint" data-i="printHint"></p>
 </div>
 <div class="pv noprint" data-i="preview"></div>
 <div id="fout"></div>
</div>

 r.onload=function(){var im=new Image();
  im.onerror=function(){alert(tr("rsBad"))};
  im.onload=function(){var m=400,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");

   var u=c.toDataURL("image/png");
   if(u.length>600000){x.globalCompositeOperation="destination-over";x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);u=c.toDataURL("image/jpeg",0.85)}
